[package]
name = "remote-claude"
version = "0.1.0"
edition = "2024"
description = "Claude Code's file and shell tools, served from another machine over ssh"
license = "MIT"
repository = "https://github.com/rogersnm/remote-claude"
readme = "README.md"
rust-version = "1.85"
keywords = ["claude", "mcp", "ssh", "remote"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "time", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
